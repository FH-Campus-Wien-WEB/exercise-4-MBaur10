<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movies!</title>
    <link rel="stylesheet" href="index.css" />
    <script type="module" src="index.js"></script>
  </head>

  <body>
    <header>
      <h1>Movie Madness</h1>
      <div id="userGreeting" class="user-greeting"></div>
    </header>
    <nav>
      <h2>Genres</h2>
      <ul id="filter"></ul>
      <h2>Manage</h2>
      <ul>
        <li>
          <button id="addMoviesBtn">Add movies</button>
        </li>
        <li>
          <button id="authBtn">Login</button>
        </li>
      </ul>
    </nav>
    <main></main>
   <footer>
    <ul>
    <li id="copyright"> © Movie Madness</li>
    <li id="author"> Written by ME</li> 
    <li id="contact">Please don't contact me!</li>
      </ul>
  </footer>

    <!-- Login Dialog -->
    <dialog id="loginDialog">
      <form id="loginForm">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <button type="submit">Login</button>
        <button type="button" id="cancelLogin">Cancel</button>
      </form>
    </dialog>

    <!-- Task 2.1: Add a search dialog markup. Make sure the ids of the elements 
     match the ones used in index.js. Your dialog needs a form and submit and cancel
     buttons. -->
    
  </body>
</html>
